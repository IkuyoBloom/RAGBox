[pytest]
; 测试目录：所有单测都在 backend/tests 下
testpaths = tests

; 把 backend 目录加进 sys.path，这样 `import app.xxx` 无需安装成包即可工作。
; 用 pytest 内置的 pythonpath 而不是 conftest.py 里手写 sys.path.insert：
; 后者在每个测试模块的导入时机上容易出边界问题。
pythonpath = .

; 直接支持 `async def test_xxx()`，不必给每个用例挂装饰器。
; 评估模块里有 LLM 裁判这类天然异步的函数，用 auto 模式最省事。
asyncio_mode = auto

; 让失败信息里带上中文参数名不被转义，便于定位断言
addopts = -ra
